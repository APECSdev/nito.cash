# .github/workflows/ci.yml
#
# Continuous integration + deploy for the Nito.cash monorepo.
#
#   1. build-test — install (frozen lockfile), build the web wallet, run the unit
#      tests, upload coverage to Codecov. The built `apps/web/dist` is saved as an
#      artifact for the deploy job.
#   2. deploy     — runs ONLY after build-test succeeds (on master). Uploads the
#      pre-built, pre-tested `dist/` to Cloudflare Pages (`nitocash`) via Wrangler
#      Direct Upload, plus the docs site (`nito-cash-docs`) and the static BLAZE
#      submission page (`nitocash-blaze`, served at blaze.nito.cash). Cloudflare
#      does NOT build from git — it only ever receives a tested artifact.
#
# Mirrors the "Build & Verify" steps in AGENTS.md.

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web wallet
        run: pnpm build

      # Unit tests (Phase C): Vitest + @vue/test-utils v2. Coverage (lcov) is
      # generated at apps/web/coverage/lcov.info for the Codecov upload below.
      - name: Run unit tests
        run: pnpm test:unit --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          fail_ci_if_error: true

      - name: Build docs site
        run: pnpm --filter @nito.cash/docs run build

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          # The Vite production build emits to dist-vite/ (see apps/web/vite.config.js).
          path: apps/web/dist-vite
          # Only needed by the immediately-following deploy job in this run.
          retention-days: 1

      - name: Upload docs artifact (docs-dist)
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          # VitePress build output (see apps/docs/.vitepress/config.mjs).
          path: apps/docs/.vitepress/dist
          retention-days: 1

      - name: Upload blaze artifact (blaze-dist)
        uses: actions/upload-artifact@v4
        with:
          name: blaze-dist
          # Static files, no build step (see apps/blaze/README.md).
          path: apps/blaze/*.html
          retention-days: 1

  deploy:
    # Deploy only after a green build-test, and only on pushes to master (not PRs).
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact (dist)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Cloudflare Pages (nitocash)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 38907316ed118886fa8035039f92056d
          command: pages deploy dist --project-name=nitocash

      - name: Download docs artifact (docs-dist)
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs-dist

      # BLAZE page deploys BEFORE docs so a docs-side problem can never block
      # the hackathon submission page. (Note: the docs deploy has failed since
      # 2026-10-27 — docs.nito.cash no longer resolves; the Pages project/
      # domain appears to have been deleted and needs re-creating. The web
      # (nitocash) deploy on the same token succeeds, so the token itself is
      # healthy.)
      - name: Download blaze artifact (blaze-dist)
        uses: actions/download-artifact@v4
        with:
          name: blaze-dist
          path: blaze-dist

      - name: Deploy BLAZE page to Cloudflare Pages (nitocash-blaze)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 38907316ed118886fa8035039f92056d
          command: pages deploy blaze-dist --project-name=nitocash-blaze

      - name: Deploy docs to Cloudflare Pages (nito-cash-docs)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 38907316ed118886fa8035039f92056d
          command: pages deploy docs-dist --project-name=nito-cash-docs
